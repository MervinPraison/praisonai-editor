name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs-material mkdocs-mermaid2-plugin

      - name: Check out shared theme
        uses: actions/checkout@v4
        with:
          repository: MervinPraison/praisonai-docs-theme
          ssh-key: ${{ secrets.PRAISONAI_THEME_DEPLOY_KEY }}
          persist-credentials: false
          path: .praisonai-theme
      - name: Install shared theme
        run: |
          pip install ./.praisonai-theme
          echo "PRAISONAI_THEME=praisonai" >> "$GITHUB_ENV"
      - name: Build & Deploy
        run: |
          cp CNAME docs/CNAME
          mkdocs gh-deploy --force
