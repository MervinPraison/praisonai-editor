name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PraisonAI UI
        run: pip install aiui

      - name: Build docs
        run: |
          aiui build --config aiui.template.yaml --output site --minify
          if [ -f CNAME ]; then cp CNAME site/CNAME; fi
          if [ -f docs/CNAME ]; then cp docs/CNAME site/CNAME; fi
          if [ -f mkdocs-docs/CNAME ]; then cp mkdocs-docs/CNAME site/CNAME; fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
