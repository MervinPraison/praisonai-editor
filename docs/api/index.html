ector (`--detector ffmpeg`)</a></li><li><a href="https://editor.praison.ai/docs/demix">🎵 Stem Separation (Demix)</a></li><li><a href="https://editor.praison.ai/docs/demix/cache">Stem Cache</a></li><li><a href="https://editor.praison.ai/docs/demix/primary-zone">Primary Zone Detection (`--primary-zone`)</a></li><li><a href="https://editor.praison.ai/docs/agent/prompt-edit">AI Agent Prompt-Based Editing</a></li><li><a href="https://editor.praison.ai/docs/agent/tools">Agent Tools</a></li><li><a href="https://editor.praison.ai/docs/api">Python API Overview</a></li><li><a href="https://editor.praison.ai/docs/api/edit_media">`edit_media()` — Main API</a></li><li><a href="https://editor.praison.ai/docs/api/transcription">Transcription API</a></li><li><a href="https://editor.praison.ai/docs/api/plans">Edit Plans API</a></li><li><a href="https://editor.praison.ai/docs/api/models">Data Models</a></li><li><a href="https://editor.praison.ai/docs/protocols">Extending with Protocols</a></li><li><a href="https://editor.praison.ai/docs/protocols/transcriber">Custom Transcriber</a></li><li><a href="https://editor.praison.ai/docs/protocols/editor">Custom Editor</a></li><li><a href="https://editor.praison.ai/docs/protocols/renderer">Custom Renderer</a></li><li><a href="https://editor.praison.ai/docs/artifacts">Artifacts &amp; Caching</a></li></ul></nav><h1>Python API Overview</h1>
<p>Use praisonai-editor directly from Python — no CLI needed.</p>
<h2>Core entry point</h2>
<h2>Pipeline flow</h2>
<h2>Module layout</h2>
<p>| Module | Key exports |</p>
<p>|--------|------------|</p>
<p>| <code>pipeline</code> | <code>edit_media</code>, <code>edit_audio</code>, <code>edit_video</code> |</p>
<p>| <code>probe</code> | <code>probe_media</code>, <code>FFmpegProber</code> |</p>
<p>| <code>transcribe</code> | <code>transcribe_audio</code>, <code>OpenAITranscriber</code>, <code>LocalTranscriber</code> |</p>
<p>| <code>convert</code> | <code>convert_media</code> |</p>
<p>| <code>plan</code> | <code>create_edit_plan</code>, <code>HeuristicEditor</code> |</p>
<p>| <code>detect</code> | <code>create_content_plan</code> |</p>
<p>| <code>render</code> | <code>FFmpegAudioRenderer</code>, <code>FFmpegVideoRenderer</code> |</p>
<p>| <code>_demix</code> | <code>isolate_vocals</code>, <code>has_demucs</code> |</p>
<p>| <code>models</code> | <code>EditPlan</code>, <code>EditResult</code>, <code>TranscriptResult</code>, <code>ProbeResult</code> |</p>
<p>| <code>protocols</code> | <code>Transcriber</code>, <code>Editor</code>, <code>Renderer</code>, <code>Prober</code>, <code>Converter</code> |</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/api.source.md", "text": "# Python API Overview\n\nUse praisonai-editor directly from Python — no CLI needed.\n\n## Core entry point\n\n```python\nfrom praisonai_editor.pipeline import edit_media\n\nresult = edit_media(\"podcast.mp3\", preset=\"podcast\", verbose=True)\nprint(result.output_path)    # \"podcast_edited.mp3\"\nprint(result.success)        # True\n```\n\n## Pipeline flow\n\n```mermaid\nflowchart LR\n    A[\"edit_media()\"] --\u003e B[auto-detect\\naudio vs video]\n    B --\u003e|audio| C[\"edit_audio()\"]\n    B --\u003e|video| D[\"edit_video()\"]\n    C --\u003e E[probe → transcribe\\n→ plan → render]\n    D --\u003e E\n```\n\n## Module layout\n\n| Module | Key exports |\n|--------|------------|\n| `pipeline` | `edit_media`, `edit_audio`, `edit_video` |\n| `probe` | `probe_media`, `FFmpegProber` |\n| `transcribe` | `transcribe_audio`, `OpenAITranscriber`, `LocalTranscriber` |\n| `convert` | `convert_media` |\n| `plan` | `create_edit_plan`, `HeuristicEditor` |\n| `detect` | `create_content_plan` |\n| `render` | `FFmpegAudioRenderer`, `FFmpegVideoRenderer` |\n| `_demix` | `isolate_vocals`, `has_demucs` |\n| `models` | `EditPlan`, `EditResult`, `TranscriptResult`, `ProbeResult` |\n| `protocols` | `Transcriber`, `Editor`, `Renderer`, `Prober`, `Converter` |\n"}</script>
