<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>input_path</code> | <code>str</code> | required | Path to audio or video file |</p>
<p>| <code>output_path</code> | <code>str</code> | auto | Output path (default: <code>{stem}_edited.{ext}</code>) |</p>
<p>| <code>preset</code> | <code>str</code> | <code>"podcast"</code> | Edit preset |</p>
<p>| <code>detector</code> | <code>str</code> | <code>"auto"</code> | Content detector |</p>
<p>| <code>demix</code> | <code>bool</code> | <code>False</code> | Enable Demucs stem separation |</p>
<p>| <code>primary_zone_only</code> | <code>bool</code> | <code>False</code> | Crop to primary singing zone |</p>
<p>| <code>remove_fillers</code> | <code>bool</code> | <code>True</code> | Remove filler words |</p>
<p>| <code>remove_repetitions</code> | <code>bool</code> | <code>True</code> | Remove repeated words |</p>
<p>| <code>remove_silence</code> | <code>bool</code> | <code>True</code> | Remove long silences |</p>
<p>| <code>min_silence</code> | <code>float</code> | <code>1.5</code> | Minimum silence duration (seconds) |</p>
<p>| <code>use_local_whisper</code> | <code>bool</code> | <code>False</code> | Use faster-whisper (offline) |</p>

<p>| <code>verbose</code> | <code>bool</code> | <code>False</code> | Print progress |</p>
<p>| <code>save_artifacts</code> | <code>bool</code> | <code>True</code> | Save transcript/plan/blocks to disk |</p>

<p>=== "Custom silence threshold"</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/api/edit_media.source.md", "text": "# `edit_media()` — Main API\n\n```python\nfrom praisonai_editor.pipeline import edit_media\n\nresult = edit_media(input_path, output_path=None, **kwargs)\n```\n\n## Parameters\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `input_path` | `str` | required | Path to audio or video file |\n| `output_path` | `str` | auto | Output path (default: `{stem}_edited.{ext}`) |\n| `preset` | `str` | `\"podcast\"` | Edit preset |\n| `detector` | `str` | `\"auto\"` | Content detector |\n| `demix` | `bool` | `False` | Enable Demucs stem separation |\n| `primary_zone_only` | `bool` | `False` | Crop to primary singing zone |\n| `remove_fillers` | `bool` | `True` | Remove filler words |\n| `remove_repetitions` | `bool` | `True` | Remove repeated words |\n| `remove_silence` | `bool` | `True` | Remove long silences |\n| `min_silence` | `float` | `1.5` | Minimum silence duration (seconds) |\n| `use_local_whisper` | `bool` | `False` | Use faster-whisper (offline) |\n| `language` | `str` | None | Language code (`en`, `ta`, `es`, …) |\n| `copy_codec` | `bool` | `True` | Copy codec (faster vs re-encode) |\n| `verbose` | `bool` | `False` | Print progress |\n| `save_artifacts` | `bool` | `True` | Save transcript/plan/blocks to disk |\n\n## Returns: `EditResult`\n\n```python\nresult.success         # bool\nresult.output_path     # str\nresult.input_path      # str\nresult.probe           # ProbeResult\nresult.transcript      # TranscriptResult\nresult.plan            # EditPlan\nresult.error           # str | None\nresult.artifacts       # dict[str, str]\n```\n\n## Examples\n\n=== \"Simple\"\n\n    ```python\n    from praisonai_editor.pipeline import edit_media\n\n    result = edit_media(\"podcast.mp3\")\n    ```\n\n=== \"Music extraction\"\n\n    ```python\n    result = edit_media(\n        \"concert.mp3\",\n        preset=\"songs_only\",\n        detector=\"ensemble\",\n        demix=True,\n        primary_zone_only=True,\n        verbose=True,\n    )\n    ```\n\n=== \"Custom silence threshold\"\n\n    ```python\n    result = edit_media(\n        \"recording.mp3\",\n        preset=\"podcast\",\n        min_silence=2.0,\n        remove_fillers=False,\n    )\n    ```\n"}</script>
