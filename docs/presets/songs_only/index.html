n/ffmpeg">FFmpeg heuristic detector (`--detector ffmpeg`)</a></li><li><a href="https://editor.praison.ai/docs/detection/ina">INA Speech Segmenter (`--detector ina`)</a></li><li><a href="https://editor.praison.ai/docs/detection/librosa">Librosa spectral detector (`--detector librosa`)</a></li><li><a href="https://editor.praison.ai/docs/presets">Presets Overview</a></li><li><a href="https://editor.praison.ai/docs/presets/clean">`clean` preset</a></li><li><a href="https://editor.praison.ai/docs/presets/course">`course` preset</a></li><li><a href="https://editor.praison.ai/docs/presets/meeting">`meeting` preset</a></li><li><a href="https://editor.praison.ai/docs/presets/no_silence">`no_silence` preset</a></li><li><a href="https://editor.praison.ai/docs/presets/podcast">`podcast` preset</a></li><li><a href="https://editor.praison.ai/docs/presets/songs_only">`songs_only` preset</a></li><li><a href="https://editor.praison.ai/docs/presets/speech_only">`speech_only` preset</a></li><li><a href="https://editor.praison.ai/docs/protocols">Extending with Protocols</a></li><li><a href="https://editor.praison.ai/docs/protocols/editor">Custom Editor</a></li><li><a href="https://editor.praison.ai/docs/protocols/renderer">Custom Renderer</a></li><li><a href="https://editor.praison.ai/docs/protocols/transcriber">Custom Transcriber</a></li></ul></nav><h1>`songs_only` preset</h1>
<p>Extract only the singing/music portions from a recording. Removes speech, talking, and silence.</p>
<h2>What it keeps</h2>
<li><strong>Music</strong> segments (instrumental sections)</li>
<li><strong>Singing</strong> segments (vocal melody)</li>
<li>With <code>--demix</code>: only pure <strong>singing</strong> (vocals separated from instruments)</li>
<h2>Usage</h2>
<h2>How content detection works</h2>
<h2>With `--demix` and `--primary-zone`</h2>
<p>!!! tip "Install Demucs"</p>
<h2>Python API</h2></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/presets/songs_only.source.md", "text": "# `songs_only` preset\n\nExtract only the singing/music portions from a recording. Removes speech, talking, and silence.\n\n## What it keeps\n\n- **Music** segments (instrumental sections)\n- **Singing** segments (vocal melody)\n- With `--demix`: only pure **singing** (vocals separated from instruments)\n\n## Usage\n\n```bash\n# Basic\npraisonai-editor edit concert.mp3 \\\n  --preset songs_only \\\n  --detector ensemble \\\n  -v\n\n# Best quality — with Demucs stem separation\npraisonai-editor edit concert.mp3 \\\n  --preset songs_only \\\n  --detector ensemble \\\n  --demix \\\n  --primary-zone \\\n  -v\n```\n\n## How content detection works\n\n```mermaid\nflowchart LR\n    A[Input audio] --\u003e B[FFmpeg stats\\ndetector]\n    A --\u003e C[Demucs stem\\nseparation]\n    B --\u003e D[Ensemble\\ndecision]\n    C --\u003e D\n    D --\u003e E{Block type?}\n    E --\u003e|music| F[✅ Keep]\n    E --\u003e|singing| F\n    E --\u003e|speech| G[❌ Remove]\n    E --\u003e|silence| G\n    F --\u003e H[Render output]\n    G --\u003e H\n```\n\n## With `--demix` and `--primary-zone`\n\n```mermaid\nflowchart TD\n    A[Input] --\u003e B[Demucs separates\\nvocals + instruments]\n    B --\u003e C[Classify each segment]\n    C --\u003e D[Find singing zones]\n    D --\u003e E[Identify PRIMARY zone\\nlargest singing block]\n    E --\u003e F[Trim to primary zone]\n    F --\u003e G[Output: just the concert]\n```\n\n!!! tip \"Install Demucs\"\n    ```bash\n    pip install \"praisonai-editor[demix]\"\n    ```\n\n## Python API\n\n```python\nfrom praisonai_editor.pipeline import edit_media\n\nresult = edit_media(\n    \"concert.mp3\",\n    preset=\"songs_only\",\n    detector=\"ensemble\",\n    demix=True,\n    primary_zone_only=True,\n    verbose=True,\n)\n```\n"}</script>
