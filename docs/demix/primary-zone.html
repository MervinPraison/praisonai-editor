<p>Automatically finds and extracts the <strong>main singing section</strong> from a long recording.</p>
<h2>What is a singing zone?</h2>
<p>A singing zone is a contiguous block where <code>singing</code> segments are close together. The <strong>primary zone</strong> is the longest/most significant zone — usually the main performance.</p>
<h2>Example</h2>
<p>A 40-min live recording might contain:</p>
<p><code>--primary-zone</code> crops the output to <code>05:20–27:13</code> automatically.</p>
<h2>Usage</h2>
<p>!!! note "Requires <code>--demix</code>"</p>
<p>Primary zone detection works best with Demucs stem separation, which precisely identifies <code>singing</code> vs <code>music</code>.</p>
<h2>How the algorithm works</h2>
<h2>Python API</h2></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/demix/primary-zone.source.md", "text": "# Primary Zone Detection (`--primary-zone`)\n\nAutomatically finds and extracts the **main singing section** from a long recording.\n\n## What is a singing zone?\n\nA singing zone is a contiguous block where `singing` segments are close together. The **primary zone** is the longest/most significant zone — usually the main performance.\n\n## Example\n\nA 40-min live recording might contain:\n\n```\n00:00 – 05:20  🗣️ Talking / intro\n05:20 – 27:13  🎵 Main singing performance  ← PRIMARY ZONE\n27:13 – 30:00  🗣️ Talking / outro\n30:00 – 35:00  🎵 Short bonus songs\n```\n\n`--primary-zone` crops the output to `05:20–27:13` automatically.\n\n## Usage\n\n```bash\npraisonai-editor edit concert.mp3 \\\n  --preset songs_only \\\n  --detector ensemble \\\n  --demix \\\n  --primary-zone \\\n  -v\n```\n\n!!! note \"Requires `--demix`\"\n    Primary zone detection works best with Demucs stem separation, which precisely identifies `singing` vs `music`.\n\n## How the algorithm works\n\n```mermaid\nflowchart TD\n    A[Classified blocks] --\u003e B[Find all singing segments]\n    B --\u003e C[Merge singing segments\\nwithin 30s of each other]\n    C --\u003e D[Score each zone\\nby total singing duration]\n    D --\u003e E[Select highest-scoring zone]\n    E --\u003e F[Trim output to zone boundaries]\n```\n\n## Python API\n\n```python\nresult = edit_media(\n    \"concert.mp3\",\n    preset=\"songs_only\",\n    detector=\"ensemble\",\n    demix=True,\n    primary_zone_only=True,\n)\n```\n"}</script>
