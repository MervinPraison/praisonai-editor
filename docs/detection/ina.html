<p>Uses a CNN (Convolutional Neural Network) trained on broadcast media to detect speech vs music vs noise vs silence.</p>
<h2>Install</h2>
<h2>Usage</h2>
<h2>Strengths</h2>
<li>High accuracy for <strong>speech vs music</strong> boundary detection</li>
<li>Handles noisy environments well (broadcast quality)</li>
<li>Good at detecting short speech segments within music</li>
<h2>Weaknesses</h2>
<li>Slower (CNN inference)</li>
<li>Cannot distinguish <strong>singing</strong> from music (both labeled as <code>music</code>)</li>
<li>Use with <code>--demix</code> to get singing classification</li>
<h2>Content types returned</h2>
<p>| INA label | Mapped to |</p>
<p>|-----------|-----------|</p>
<p>| <code>speech</code> | <code>speech</code> |</p>
<p>| <code>music</code> | <code>music</code> |</p>
<p>| <code>noEnergy</code> | <code>silence</code> |</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/detection/ina.source.md", "text": "# INA Speech Segmenter (`--detector ina`)\n\nUses a CNN (Convolutional Neural Network) trained on broadcast media to detect speech vs music vs noise vs silence.\n\n## Install\n\n```bash\npip install \"praisonai-editor[detect]\"\n```\n\n## Usage\n\n```bash\npraisonai-editor edit file.mp3 --preset speech_only --detector ina\n```\n\n## Strengths\n\n- High accuracy for **speech vs music** boundary detection\n- Handles noisy environments well (broadcast quality)\n- Good at detecting short speech segments within music\n\n## Weaknesses\n\n- Slower (CNN inference)\n- Cannot distinguish **singing** from music (both labeled as `music`)\n- Use with `--demix` to get singing classification\n\n## Content types returned\n\n| INA label | Mapped to |\n|-----------|-----------|\n| `speech` | `speech` |\n| `music` | `music` |\n| `noEnergy` | `silence` |\n"}</script>
