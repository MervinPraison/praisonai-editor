<p>Uses spectral features (RMS energy, spectral centroid, zero-crossing rate) from librosa to classify segments.</p>
<h2>Usage</h2>
<h2>How it works</h2>
<h2>Strengths</h2>
<li>No extra install (librosa is a base dependency after install)</li>
<li>Fast — runs on CPU without ML inference</li>
<li>Works fine for clean recordings</li>
<h2>Weaknesses</h2>
<li>Less accurate than ensemble or INA on noisy or complex audio</li>
<li>May confuse speech over music as pure music</li></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/detection/librosa.source.md", "text": "# Librosa spectral detector (`--detector librosa`)\n\nUses spectral features (RMS energy, spectral centroid, zero-crossing rate) from librosa to classify segments.\n\n## Usage\n\n```bash\npraisonai-editor edit file.mp3 --preset songs_only --detector librosa\n```\n\n## How it works\n\n```mermaid\nflowchart LR\n    A[Audio frame] --\u003e B[RMS energy dB]\n    A --\u003e C[Spectral centroid]\n    A --\u003e D[Zero-crossing rate]\n    B --\u003e E[Classify frame]\n    C --\u003e E\n    D --\u003e E\n    E --\u003e F{speech, music,\\nsilence, singing?}\n```\n\n## Strengths\n\n- No extra install (librosa is a base dependency after install)\n- Fast — runs on CPU without ML inference\n- Works fine for clean recordings\n\n## Weaknesses\n\n- Less accurate than ensemble or INA on noisy or complex audio\n- May confuse speech over music as pure music\n"}</script>
