<p>The recommended detector. Combines multiple detectors and uses a voting algorithm to pick the most confident classification for each segment.</p>
<h2>Usage</h2>
<p>The <code>--detector auto</code> option also routes to ensemble.</p>
<h2>How it works</h2>
<p><strong>Conflict resolution rules:</strong></p>
<li>If INA is available → INA has highest priority for speech/music boundaries</li>
<li>If Demucs is used → demix scores refine singing vs talking-over-music</li>
<li>FFmpeg provides base signal statistics for all segments</li>
<h2>Confidence scores</h2>
<p>Each block gets a <code>confidence</code> score (0–1). Low-confidence borders are re-classified using weighted voting from all available detectors.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/detection/ensemble.source.md", "text": "# Ensemble detector (`--detector ensemble`)\n\nThe recommended detector. Combines multiple detectors and uses a voting algorithm to pick the most confident classification for each segment.\n\n## Usage\n\n```bash\npraisonai-editor edit file.mp3 --preset songs_only --detector ensemble\n```\n\nThe `--detector auto` option also routes to ensemble.\n\n## How it works\n\n```mermaid\nflowchart LR\n    A[Audio] --\u003e B[FFmpeg astats]\n    A --\u003e C[Librosa spectral]\n    A --\u003e D[INA CNN\\nif installed]\n    A --\u003e E[Demucs stems\\nif --demix]\n    B --\u003e F[Ensemble decision\\nconflict resolution]\n    C --\u003e F\n    D --\u003e F\n    E --\u003e F\n    F --\u003e G[Classified blocks\\nwith confidence]\n```\n\n**Conflict resolution rules:**\n- If INA is available → INA has highest priority for speech/music boundaries\n- If Demucs is used → demix scores refine singing vs talking-over-music\n- FFmpeg provides base signal statistics for all segments\n\n## Confidence scores\n\nEach block gets a `confidence` score (0–1). Low-confidence borders are re-classified using weighted voting from all available detectors.\n"}</script>
