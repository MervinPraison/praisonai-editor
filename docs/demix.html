<p>Powered by <a href="https://github.com/facebookresearch/demucs">Demucs</a> — an AI model that separates audio into vocal and instrument tracks.</p>
<h2>Why stem separation?</h2>
<p>Without demix, a segment where someone sings over a backing track is labeled <code>speech_over_music</code> — ambiguous.</p>
<p>With demix, that segment becomes precisely classified as <code>singing</code> — enabling clean extraction.</p>
<h2>Install</h2>
<h2>Usage</h2>
<h2>What Demucs separates</h2>
<p>| Stem | File | Description |</p>
<p>|------|------|-------------|</p>
<p>| <code>vocals</code> | <code>vocals.wav</code> | Isolated vocal track |</p>
<p>| <code>no_vocals</code> | <code>no_vocals.wav</code> | All instruments (no voice) |</p>
<h2>Stem cache</h2>
<p>The first run is slow (CPU inference on a 40-min file ≈ 10 min). After that, stems are cached forever:</p>
<p>Second run is ~8 seconds. See Stem Cache for details.</p>
<h2>Supported models</h2>
<p>| Model | Notes |</p>
<p>|-------|-------|</p>
<p>| <code>mdx_extra</code> | Default — best quality |</p>
<p>| <code>htdemucs</code> | More stems (drums, bass, etc.) |</p>
<p>| <code>mdx_extra_q</code> | Quantized — lower memory |</p>
<h2>Python API</h2></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/demix.source.md", "text": "# 🎵 Stem Separation (Demix)\n\nPowered by [Demucs](https://github.com/facebookresearch/demucs) — an AI model that separates audio into vocal and instrument tracks.\n\n## Why stem separation?\n\nWithout demix, a segment where someone sings over a backing track is labeled `speech_over_music` — ambiguous.\n\nWith demix, that segment becomes precisely classified as `singing` — enabling clean extraction.\n\n```mermaid\nflowchart LR\n    A[Concert recording] --\u003e B{Without --demix}\n    B --\u003e C[\"speech_over_music 🤷\"]\n    A --\u003e D{With --demix}\n    D --\u003e E[\"Demucs separates\\nvocals + instruments\"]\n    E --\u003e F[\"singing ✅\"]\n    E --\u003e G[\"music ✅\"]\n```\n\n## Install\n\n```bash\npip install \"praisonai-editor[demix]\"\n```\n\n## Usage\n\n```bash\npraisonai-editor edit concert.mp3 \\\n  --preset songs_only \\\n  --detector ensemble \\\n  --demix \\\n  --primary-zone \\\n  -v\n```\n\n## What Demucs separates\n\n| Stem | File | Description |\n|------|------|-------------|\n| `vocals` | `vocals.wav` | Isolated vocal track |\n| `no_vocals` | `no_vocals.wav` | All instruments (no voice) |\n\n## Stem cache\n\nThe first run is slow (CPU inference on a 40-min file ≈ 10 min). After that, stems are cached forever:\n\n```\n~/.praisonai/editor/.demix_cache/{sha256_hash}/\n  ├── vocals.wav       (first 8 MiB SHA-256 hash → unique per file)\n  └── no_vocals.wav\n```\n\nSecond run is ~8 seconds. See [Stem Cache](cache.md) for details.\n\n## Supported models\n\n| Model | Notes |\n|-------|-------|\n| `mdx_extra` | Default — best quality |\n| `htdemucs` | More stems (drums, bass, etc.) |\n| `mdx_extra_q` | Quantized — lower memory |\n\n## Python API\n\n```python\nfrom praisonai_editor._demix import isolate_vocals, has_demucs\n\nif has_demucs():\n    vocals_path, inst_path = isolate_vocals(\n        \"concert.mp3\",\n        model_name=\"mdx_extra\",  # default\n        device=\"cpu\",            # or \"mps\" for Apple Silicon\n        verbose=True,\n    )\n```\n"}</script>
