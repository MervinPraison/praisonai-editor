<p>Transcribe any audio or video file with word-level timestamps.</p>
<h2>Usage</h2>
<h2>Options</h2>
<p>| Option | Short | Default | Description |</p>
<p>|--------|-------|---------|-------------|</p>
<p>| <code>INPUT</code> | | | Audio or video file |</p>
<p>| <code>--output</code> | <code>-o</code> | stdout | Output file path |</p>
<p>| <code>--format</code> | <code>-f</code> | <code>srt</code> | Output format: <code>srt</code>, <code>txt</code>, <code>json</code> |</p>
<p>| <code>--local</code> | | False | Use offline faster-whisper |</p>
<p>| <code>--language</code> | | auto | Language code e.g. <code>en</code>, <code>ta</code>, <code>es</code> |</p>
<p>| <code>--speed</code> | | <code>1.0</code> | Speed before ASR (e.g. <code>2.0</code> halves API cost; timestamps scaled back) |</p>
<h2>Examples</h2>

<p>=== "Plain text"</p>

<h2>How it works</h2>
<p>!!! info "Transcript cache"</p>
<p>After transcribing, the result is cached at <code>~/.praisonai/editor/{file}/transcript.json</code>.</p>
<p>Running <code>edit</code> on the same file loads from cache — <strong>no repeat API calls</strong>.</p>
<p>!!! tip "Python API"</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/commands/transcribe.source.md", "text": "# `transcribe` — Audio/video to text\n\nTranscribe any audio or video file with word-level timestamps.\n\n## Usage\n\n```bash\npraisonai-editor transcribe INPUT [OPTIONS]\n```\n\n## Options\n\n| Option | Short | Default | Description |\n|--------|-------|---------|-------------|\n| `INPUT` | | | Audio or video file |\n| `--output` | `-o` | stdout | Output file path |\n| `--format` | `-f` | `srt` | Output format: `srt`, `txt`, `json` |\n| `--local` | | False | Use offline faster-whisper |\n| `--language` | | auto | Language code e.g. `en`, `ta`, `es` |\n| `--speed` | | `1.0` | Speed before ASR (e.g. `2.0` halves API cost; timestamps scaled back) |\n\n## Examples\n\n=== \"SRT subtitles\"\n\n    ```bash\n    praisonai-editor transcribe video.mp4 --format srt --output video.srt\n    ```\n\n    ```\n    1\n    00:00:00,000 --\u003e 00:00:03,240\n    Welcome everyone to today's session.\n\n    2\n    00:00:03,800 --\u003e 00:00:07,100\n    We'll be covering the main topics.\n    ```\n\n=== \"Plain text\"\n\n    ```bash\n    praisonai-editor transcribe podcast.mp3 --format txt\n    ```\n\n=== \"Text from existing JSON\"\n\n    If you already have a transcript JSON (from ``--format json``), extract plain text without re-transcribing:\n\n    ```bash\n    praisonai-editor extract-text words.json -o words.txt\n    # default output: words.txt (same stem as input)\n    praisonai-editor extract-text VCasP2Z2wQM_41m58_to_1h36m41.transcript.json\n    ```\n\n=== \"JSON with timestamps\"\n\n    ```bash\n    praisonai-editor transcribe audio.mp3 --format json --output words.json\n    ```\n\n    ```json\n    {\n      \"text\": \"Welcome everyone to today's session.\",\n      \"words\": [\n        {\"text\": \"Welcome\", \"start\": 0.0, \"end\": 0.52, \"confidence\": 0.99},\n        {\"text\": \"everyone\", \"start\": 0.58, \"end\": 1.10, \"confidence\": 0.99}\n      ],\n      \"language\": \"en\",\n      \"duration\": 1823.4\n    }\n    ```\n\n=== \"Tamil (non-English)\"\n\n    ```bash\n    praisonai-editor transcribe audio.mp3 --language ta\n    ```\n\n=== \"Offline\"\n\n    ```bash\n    pip install \"praisonai-editor[local]\"\n    praisonai-editor transcribe audio.mp3 --local\n    ```\n\n## How it works\n\n```mermaid\nflowchart LR\n    A[audio/video] --\u003e B[Extract MP3]\n    B --\u003e C{File \u003e 10 min?}\n    C --\u003e|Yes| D[Split into\\n10-min chunks]\n    C --\u003e|No| E[Single API call]\n    D --\u003e F[Whisper API\\n× N chunks]\n    E --\u003e F\n    F --\u003e G[Merge + offset\\ntimestamps]\n    G --\u003e H[SRT / TXT / JSON]\n```\n\n!!! info \"Transcript cache\"\n    After transcribing, the result is cached at `~/.praisonai/editor/{file}/transcript.json`.\n    Running `edit` on the same file loads from cache — **no repeat API calls**.\n\n!!! tip \"Python API\"\n    ```python\n    from praisonai_editor.transcribe import transcribe_audio\n\n    result = transcribe_audio(\"podcast.mp3\", language=\"en\")\n    print(result.text)       # full text\n    print(result.to_srt())   # SRT subtitles\n    for w in result.words:\n        print(w.start, w.text)\n    ```\n"}</script>
