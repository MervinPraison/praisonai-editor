<p>Convert between audio and video formats using FFmpeg.</p>
<h2>Usage</h2>
<h2>Options</h2>
<p>| Option | Short | Default | Description |</p>
<p>|--------|-------|---------|-------------|</p>
<p>| <code>INPUT</code> | | | Source media file |</p>
<p>| <code>--output</code> | <code>-o</code> | <code>{stem}.{format}</code> | Output file path |</p>
<p>| <code>--format</code> | <code>-f</code> | <code>mp3</code> | Target format: <code>mp3</code>, <code>wav</code>, <code>m4a</code> |</p>
<p>| <code>--bitrate</code> | <code>-b</code> | <code>192k</code> | Audio bitrate |</p>
<h2>Examples</h2>
<p>=== "MP4 → MP3"</p>
<p>=== "High quality"</p>
<p>=== "WAV output"</p>
<p>=== "Custom output path"</p>
<h2>Bitrate guide</h2>
<p>| Bitrate | Use case |</p>
<p>|---------|----------|</p>
<p>| <code>64k</code> | Voice / speech (small file) |</p>
<p>| <code>128k</code> | Standard quality |</p>
<p>| <code>192k</code> | Good quality *(default)* |</p>
<p>| <code>320k</code> | High quality / music |</p>
<p>!!! tip "Python API"</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/commands/convert.source.md", "text": "# `convert` — Convert between formats\n\nConvert between audio and video formats using FFmpeg.\n\n## Usage\n\n```bash\npraisonai-editor convert INPUT [OPTIONS]\n```\n\n## Options\n\n| Option | Short | Default | Description |\n|--------|-------|---------|-------------|\n| `INPUT` | | | Source media file |\n| `--output` | `-o` | `{stem}.{format}` | Output file path |\n| `--format` | `-f` | `mp3` | Target format: `mp3`, `wav`, `m4a` |\n| `--bitrate` | `-b` | `192k` | Audio bitrate |\n\n## Examples\n\n=== \"MP4 → MP3\"\n\n    ```bash\n    praisonai-editor convert video.mp4\n    # → video.mp3 (192k)\n    ```\n\n=== \"High quality\"\n\n    ```bash\n    praisonai-editor convert video.mp4 --bitrate 320k\n    ```\n\n=== \"WAV output\"\n\n    ```bash\n    praisonai-editor convert podcast.mp3 --format wav\n    ```\n\n=== \"Custom output path\"\n\n    ```bash\n    praisonai-editor convert video.mp4 --output ~/Desktop/audio.mp3\n    ```\n\n## Bitrate guide\n\n| Bitrate | Use case |\n|---------|----------|\n| `64k` | Voice / speech (small file) |\n| `128k` | Standard quality |\n| `192k` | Good quality *(default)* |\n| `320k` | High quality / music |\n\n!!! tip \"Python API\"\n    ```python\n    from praisonai_editor.convert import convert_media\n\n    output = convert_media(\"video.mp4\", \"audio.mp3\", bitrate=\"192k\")\n    print(output)  # \"audio.mp3\"\n    ```\n"}</script>
