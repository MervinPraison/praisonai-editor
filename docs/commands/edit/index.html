ector (`--detector ffmpeg`)</a></li><li><a href="https://editor.praison.ai/docs/demix">🎵 Stem Separation (Demix)</a></li><li><a href="https://editor.praison.ai/docs/demix/cache">Stem Cache</a></li><li><a href="https://editor.praison.ai/docs/demix/primary-zone">Primary Zone Detection (`--primary-zone`)</a></li><li><a href="https://editor.praison.ai/docs/agent/prompt-edit">AI Agent Prompt-Based Editing</a></li><li><a href="https://editor.praison.ai/docs/agent/tools">Agent Tools</a></li><li><a href="https://editor.praison.ai/docs/api">Python API Overview</a></li><li><a href="https://editor.praison.ai/docs/api/edit_media">`edit_media()` — Main API</a></li><li><a href="https://editor.praison.ai/docs/api/transcription">Transcription API</a></li><li><a href="https://editor.praison.ai/docs/api/plans">Edit Plans API</a></li><li><a href="https://editor.praison.ai/docs/api/models">Data Models</a></li><li><a href="https://editor.praison.ai/docs/protocols">Extending with Protocols</a></li><li><a href="https://editor.praison.ai/docs/protocols/transcriber">Custom Transcriber</a></li><li><a href="https://editor.praison.ai/docs/protocols/editor">Custom Editor</a></li><li><a href="https://editor.praison.ai/docs/protocols/renderer">Custom Renderer</a></li><li><a href="https://editor.praison.ai/docs/artifacts">Artifacts &amp; Caching</a></li></ul></nav><h1>`edit` — Full editing pipeline</h1>
<p>The main command. Runs transcription → content detection → plan → render in one shot.</p>
<h2>Usage</h2>
<h2>All Options</h2>
<p>| Option | Short | Default | Description |</p>
<p>|--------|-------|---------|-------------|</p>
<p>| <code>INPUT</code> | | | Input media file (audio or video) |</p>
<p>| <code>--output</code> | <code>-o</code> | <code>{stem}_edited.{ext}</code> | Output file path |</p>
<p>| <code>--preset</code> | <code>-p</code> | <code>podcast</code> | Edit preset (see Presets) |</p>
<p>| <code>--prompt</code> | | | Natural language instruction (AI agent) |</p>
<p>| <code>--detector</code> | | <code>auto</code> | Content detector: <code>auto</code> · <code>ensemble</code> · <code>ina</code> · <code>librosa</code> · <code>ffmpeg</code> |</p>
<p>| <code>--demix</code> | | off | Enable Demucs vocal stem separation |</p>
<p>| <code>--primary-zone</code> | | off | Crop to primary singing zone only |</p>
<p>| <code>--no-fillers</code> | | off | Keep filler words (don't remove) |</p>
<p>| <code>--no-repetitions</code> | | off | Keep repetitions |</p>
<p>| <code>--no-silence</code> | | off | Keep silences |</p>
<p>| <code>--local</code> | | off | Use offline faster-whisper |</p>
<p>| <code>--language</code> | | auto | Language code (<code>en</code>, <code>ta</code>, <code>es</code>, …) |</p>
<p>| <code>--reencode</code> | | off | Re-encode instead of stream copy (slower, better quality) |</p>
<p>| <code>--no-artifacts</code> | | off | Don't save artifacts to <code>~/.praisonai/editor/</code> |</p>
<p>| <code>--verbose</code> | <code>-v</code> | off | Print step-by-step progress |</p>
<h2>Examples</h2>

<p>Removes: fillers · repetitions · silences &gt; 1.5s</p>

<h2>Python API</h2></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/commands/edit.source.md", "text": "# `edit` — Full editing pipeline\n\nThe main command. Runs transcription → content detection → plan → render in one shot.\n\n## Usage\n\n```bash\npraisonai-editor edit INPUT [OPTIONS]\n```\n\n## All Options\n\n| Option | Short | Default | Description |\n|--------|-------|---------|-------------|\n| `INPUT` | | | Input media file (audio or video) |\n| `--output` | `-o` | `{stem}_edited.{ext}` | Output file path |\n| `--preset` | `-p` | `podcast` | Edit preset (see [Presets](../presets/index.md)) |\n| `--prompt` | | | Natural language instruction (AI agent) |\n| `--detector` | | `auto` | Content detector: `auto` · `ensemble` · `ina` · `librosa` · `ffmpeg` |\n| `--demix` | | off | Enable Demucs vocal stem separation |\n| `--primary-zone` | | off | Crop to primary singing zone only |\n| `--no-fillers` | | off | Keep filler words (don't remove) |\n| `--no-repetitions` | | off | Keep repetitions |\n| `--no-silence` | | off | Keep silences |\n| `--local` | | off | Use offline faster-whisper |\n| `--language` | | auto | Language code (`en`, `ta`, `es`, …) |\n| `--reencode` | | off | Re-encode instead of stream copy (slower, better quality) |\n| `--no-artifacts` | | off | Don't save artifacts to `~/.praisonai/editor/` |\n| `--verbose` | `-v` | off | Print step-by-step progress |\n\n---\n\n## Pipeline overview\n\n```mermaid\nflowchart LR\n    Input --\u003e Probe\n    Probe --\u003e Cache{Transcript\\ncached?}\n    Cache --\u003e|Yes| Plan\n    Cache --\u003e|No| Whisper --\u003e Plan\n    Plan --\u003e Detect{Content\\npreset?}\n    Detect --\u003e|songs_only\\nspeech_only\\nno_silence| ContentDetect\n    Detect --\u003e|podcast\\nmeeting\\ncourse\\nclean| Heuristic\n    ContentDetect --\u003e|--demix| Demucs\n    ContentDetect --\u003e Render\n    Demucs --\u003e Render\n    Heuristic --\u003e Render\n    Render --\u003e Output\n```\n\n---\n\n## Examples\n\n=== \"Podcast (default)\"\n\n    ```bash\n    praisonai-editor edit podcast.mp3 -v\n    ```\n    Removes: fillers · repetitions · silences \u003e 1.5s\n\n=== \"Keep only songs\"\n\n    ```bash\n    praisonai-editor edit concert.mp3 \\\n      --preset songs_only \\\n      --detector ensemble \\\n      --demix \\\n      --primary-zone \\\n      -v\n    ```\n\n=== \"Speech only (remove music)\"\n\n    ```bash\n    praisonai-editor edit radio.mp3 --preset speech_only --detector ensemble\n    ```\n\n=== \"Video meeting cleanup\"\n\n    ```bash\n    praisonai-editor edit meeting.mp4 --preset meeting -v\n    ```\n\n=== \"AI agent edit\"\n\n    ```bash\n    praisonai-editor edit interview.mp3 \\\n      --prompt \"Remove the intro and any off-topic discussion\"\n    ```\n\n=== \"Tamil language\"\n\n    ```bash\n    praisonai-editor edit audio.mp3 --language ta -v\n    ```\n\n=== \"Offline\"\n\n    ```bash\n    pip install \"praisonai-editor[local]\"\n    praisonai-editor edit audio.mp3 --local -v\n    ```\n\n---\n\n## Artifacts saved\n\n```\n~/.praisonai/editor/{filename}/\n  ├── probe.json\n  ├── transcript.json   ← cached — reused on second run\n  ├── transcript.srt\n  ├── transcript.txt\n  ├── plan.json\n  └── content_blocks.json  ← only with --detector\n```\n\nUse `--no-artifacts` to skip saving.\n\n---\n\n## Python API\n\n```python\nfrom praisonai_editor.pipeline import edit_media\n\nresult = edit_media(\n    \"podcast.mp3\",\n    output_path=\"podcast_clean.mp3\",\n    preset=\"podcast\",\n    verbose=True,\n)\n\nprint(result.success)          # True\nprint(result.output_path)      # \"podcast_clean.mp3\"\nprint(result.plan.removed_duration)  # seconds removed\n```\n"}</script>
