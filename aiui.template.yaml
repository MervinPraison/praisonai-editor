schemaVersion: 1
site:
  title: 🎙️ PraisonAI Editor
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
  description: AI-powered audio & video editor — transcribe, clean, and edit media
    with one command
seo:
  siteUrl: https://editor.praison.ai
navigation:
  tabs:
  - tab: 🏠 Home
    groups:
    - group: 🏠 Home
      pages:
      - index
  - tab: 🚀 Quick Start
    groups:
    - group: 🚀 Quick Start
      pages:
      - quickstart
  - tab: CLI Commands
    groups:
    - group: CLI Commands
      pages:
      - commands/probe
      - commands/convert
      - commands/transcribe
      - commands/plan
      - commands/edit
      prefix: commands
  - tab: 🎛️ Presets
    groups:
    - group: 🎛️ Presets
      pages:
      - presets/index
      - presets/podcast
      - presets/meeting
      - presets/course
      - presets/clean
      - presets/songs_only
      - presets/speech_only
      - presets/no_silence
      prefix: presets
  - tab: 🔍 Content Detection
    groups:
    - group: 🔍 Content Detection
      pages:
      - detection/index
      - detection/ensemble
      - detection/ina
      - detection/librosa
      - detection/ffmpeg
      prefix: detection
  - tab: 🎵 Stem Separation (Demix)
    groups:
    - group: 🎵 Stem Separation (Demix)
      pages:
      - demix/index
      - demix/cache
      - demix/primary-zone
      prefix: demix
  - tab: 🤖 AI Agent Editing
    groups:
    - group: 🤖 AI Agent Editing
      pages:
      - agent/prompt-edit
      - agent/tools
      prefix: agent
  - tab: 🐍 Python API
    groups:
    - group: 🐍 Python API
      pages:
      - api/index
      - api/edit_media
      - api/transcription
      - api/plans
      - api/models
      prefix: api
  - tab: 🔌 Extending (Protocols)
    groups:
    - group: 🔌 Extending (Protocols)
      pages:
      - protocols/index
      - protocols/transcriber
      - protocols/editor
      - protocols/renderer
      prefix: protocols
  - tab: 📦 Artifacts & Cache
    groups:
    - group: 📦 Artifacts & Cache
      pages:
      - artifacts/index
      prefix: artifacts
  - tab: ⚙️ Installation
    groups:
    - group: ⚙️ Installation
      pages:
      - install
navbar:
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/praisonai-editor
footer:
  socials:
    github: https://github.com/MervinPraison/praisonai-editor
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: 🎙️ PraisonAI Editor
  footer_main:
    type: Footer
    props:
      text: 🎙️ PraisonAI Editor
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
